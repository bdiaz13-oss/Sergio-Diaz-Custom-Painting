{% extends "base.html" %}
{% block body %}
  <div class="container mt-4">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body text-dark">
            <h2 class="card-title mb-4">Request an estimate</h2>
            <form method="post">
              <div class="mb-3">
                <label class="form-label">Name (first + last):
                  <input class="form-control" name="name" required>
                </label>
                    <div class="card shadow border-0">
                      <div class="card-header bg-success text-white text-center">
                        <h2 class="mb-0">Request an Estimate</h2>
                      </div>
                      <div class="card-body bg-light">
                        <form method="post" autocomplete="off">
                          <div class="mb-3">
                            <label for="name" class="form-label">Name (first + last)</label>
                            <input type="text" class="form-control" id="name" name="name" required>
                          </div>
                          <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" required>
                          </div>
                          <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email">
                          </div>
                          <div class="mb-3">
                            <label for="referrer_code" class="form-label">Referral code (if any)</label>
                            <input type="text" class="form-control" id="referrer_code" name="referrer_code" placeholder="e.g., ABC123">
                          </div>
                          <div class="mb-3">
                            <label for="referrer_name" class="form-label">Referrer name (if no code)</label>
                            <input type="text" class="form-control" id="referrer_name" name="referrer_name" placeholder="e.g., Maria R.">
                          </div>
                          <div class="mb-3">
                            <label for="project_type" class="form-label">Project type</label>
                            <select class="form-select" id="project_type" name="project_type">
                              <option>Interior</option>
                              <option>Exterior</option>
                              <option>Cabinet / trim</option>
                            </select>
                          </div>
                          <div class="mb-3">
                            <label for="rooms" class="form-label">Rooms or area</label>
                            <input type="text" class="form-control" id="rooms" name="rooms" placeholder="e.g., kitchen + living room">
                          </div>
                          <div class="mb-3">
                            <label for="budget_range" class="form-label">Budget range</label>
                            <select class="form-select" id="budget_range" name="budget_range">
                              <option>$500–$1,500</option>
                              <option>$1,500–$5,000</option>
                              <option>$5,000+</option>
                            </select>
                          </div>
                          <div class="mb-3">
                            <label for="timeline" class="form-label">Preferred timeline</label>
                            <input type="text" class="form-control" id="timeline" name="timeline" placeholder="e.g., next 2 weeks">
                          </div>
                          <div class="mb-3">
                            <label for="notes" class="form-label">Notes (optional)</label>
                            <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                          </div>
                          <button type="submit" class="btn btn-success w-100">Submit Request</button>
                        </form>
                      </div>
                    </div>
{% endblock %}
